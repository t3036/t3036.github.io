<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài học đang được cập nhật &mdash; IC3 GS6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .thong-bao-khu{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:2rem 1rem}
  .thong-bao{max-width:520px;text-align:center;background:#fff;border-radius:22px;
    padding:2.4rem 1.8rem 2.2rem;box-shadow:0 10px 30px rgba(20,30,60,.08)}
  .thong-bao__icon{font-size:3.2rem;display:block;margin-bottom:.6rem}
  .thong-bao h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;margin:.2rem 0 .8rem}
  .thong-bao p{font-family:"Be Vietnam Pro",sans-serif;color:#5b6472;line-height:1.6;margin:0 0 1.6rem}
  .thong-bao .quay-lai{background:#2A4BD8;color:#fff;border:none}
  .thong-bao .quay-lai:hover{background:#1d38ad}
</style>
</head>
<body>

<header class="thanh-menu">
  <div class="menu-trong">
    <a class="logo" href="index.html">
      <span class="logo-icon" aria-hidden="true">🚀</span>
      <span class="logo-chu">Trang chủ</span>
    </a>
  </div>
</header>

<main class="thong-bao-khu">
  <section class="thong-bao">
    <span class="thong-bao__icon" aria-hidden="true">🛠️</span>
    <h1>Bài học đang được cập nhật</h1>
    <p>Nội dung bài học này đang được xây dựng. Các em vui lòng quay lại sau nhé!</p>
    <a class="quay-lai" href="javascript:history.back()">&#8592; Quay lại</a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
