<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đội Khám phá – Bài 27·28·29 Cộng tác</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --bg2:#ffeccc; --card:#ffffff; --ink:#2b2540; --mute:#6b6585; --line:#eadfc8;
  --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --focus:#2563eb;
  --c1:#f97316; --c1s:#ffedd5; --c2:#0d9488; --c2s:#ccfbf1; --c3:#7c3aed; --c3s:#ede9fe; --c4:#db2777; --c4s:#fce7f3;
  --shadow:0 4px 0 rgba(43,37,64,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1830; --bg2:#262042; --card:#2a2445; --ink:#f1edff; --mute:#b3accf; --line:#3d3562;
    --okbg:#14532d; --badbg:#7f1d1d; --c1s:#4a2a12; --c2s:#0f3d3a; --c3s:#34265c; --c4s:#4c1d3a; --shadow:0 4px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1830; --bg2:#262042; --card:#2a2445; --ink:#f1edff; --mute:#b3accf; --line:#3d3562;
  --okbg:#14532d; --badbg:#7f1d1d; --c1s:#4a2a12; --c2s:#0f3d3a; --c3s:#34265c; --c4s:#4c1d3a; --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.6 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand a{color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;margin-right:6px}
.stars{font-weight:800;background:var(--bg2);border-radius:999px;padding:2px 12px}
.fsz{display:flex;gap:6px}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
.path{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 2px;font-size:13px;font-weight:700;text-align:center;line-height:1.25;color:var(--mute)}
.pill b{display:block;font-size:18px}
.pill.on{color:var(--ink);border-color:var(--pc,var(--ink));background:var(--pcs,var(--bg2))}
.pill.done::after{content:" ✓";color:var(--ok)}
.pill.lock{opacity:.55;cursor:not-allowed;border-style:dashed}
.pill.lock::after{content:" 🔒"}
.st.lock{opacity:.6;cursor:not-allowed;border-style:dashed}

main{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2;margin:.2em 0}
h2{font-size:clamp(21px,4vw,26px);line-height:1.3;margin:0 0 .4em}
h3{font-size:19px;margin:0 0 .3em}
p{margin:.4em 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.tag{display:inline-block;border-radius:999px;padding:1px 12px;font-size:13px;font-weight:800;background:var(--tc,var(--bg2));color:var(--ink)}
.en{color:var(--mute);font-style:italic;font-weight:600}
.key{background:var(--tc,var(--bg2));border-radius:14px;padding:10px 14px;margin:10px 0 0;font-weight:600}
.btn{border:0;border-radius:16px;padding:12px 22px;font-weight:800;background:var(--ac,var(--c1));color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22);min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pic{border-radius:16px;margin:10px auto;max-height:340px;object-fit:contain;background:#fff}

/* home */
.hero{display:grid;gap:14px;grid-template-columns:1fr;align-items:center}
@media(min-width:700px){.hero{grid-template-columns:1.1fr 1fr}}
.stations{display:grid;gap:12px;margin-top:6px}
@media(min-width:900px){.stations{grid-template-columns:repeat(3,1fr)}.st{flex-direction:column;align-items:flex-start}}
.st{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.st .ic{font-size:34px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--sc);flex:none}
.st small{color:var(--mute);font-weight:600;display:block}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}

/* learn cards */
.learn{display:grid;gap:14px}
.flow{display:grid;gap:16px;margin-top:14px}
.flow>.card{margin:0}
.lbody .pic{margin:10px auto}
.exs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ex{background:var(--card);border-radius:14px;padding:6px;font-size:15px;display:grid;gap:4px;align-content:start}
.ex img{border-radius:10px;width:100%}
.ex img[hidden]{display:none}
.qm{width:100%;aspect-ratio:298/175;border:3px dashed var(--line);border-radius:10px;background:var(--bg2);font-size:56px;font-weight:800;color:var(--mute)}
.qm:hover{border-color:var(--ink)}
@media(max-width:480px){.exs{grid-template-columns:1fr}}
@media(min-width:860px){.lbody.hasimg{display:grid;grid-template-columns:minmax(260px,2fr) 3fr;gap:22px;align-items:center}.lbody.hasimg .pic{margin:0;max-height:300px}}
.qdone{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-left:10px solid var(--ok);background:var(--card);border-radius:16px;padding:8px 14px;font-weight:600;color:var(--mute)}
.qtag{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:800;color:var(--ac)}
.opts{display:grid;gap:0 12px}
@media(min-width:860px){.opts{grid-template-columns:1fr 1fr}.opts .hint{grid-column:1/-1}.opts.one{grid-template-columns:1fr}}
.lc{border-left:10px solid var(--ac)}
.cols{display:grid;gap:10px}
@media(min-width:640px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.mini{border-radius:16px;padding:12px 14px;background:var(--tc);font-weight:600}
.mini b{display:block;font-size:18px}
.big{font-size:30px;line-height:1}

/* quiz */
.dots{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.dots i{width:26px;height:10px;border-radius:99px;background:var(--line)}
.dots i.cur{background:var(--ac)}
.dots i.ok{background:var(--ok)}
.dots i.fix{background:#f59e0b}
.q{font-size:19px;font-weight:700;margin:0 0 12px}
.hint{color:var(--mute);font-size:14px;font-weight:600;margin:-6px 0 10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 10px;font-weight:600}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.sel .k{background:var(--ac);border-color:var(--ac);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.lock{pointer-events:none}
.pairs{display:grid;gap:10px}
@media(min-width:640px){.pairs{grid-template-columns:1fr 1.5fr}}
.pairs .col{display:grid;gap:10px;align-content:start}
.chip{position:relative;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px 10px 14px;text-align:left;font-weight:600}
.chip.act{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.chip .n{position:absolute;right:8px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
mark{background:#fde047;color:#2b2540;border-radius:6px;padding:0 4px;font-weight:800}
.chip.paired{border-color:var(--pk);box-shadow:0 0 0 3px color-mix(in srgb,var(--pk) 30%,transparent)}
.chip.paired .n{background:var(--pk)}
.chip.right{border-color:var(--ok);background:var(--okbg)}
.chip.wrong{border-color:var(--bad);background:var(--badbg)}
.sort{display:grid;gap:10px}
.srow{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--card)}
.srow.right{border-color:var(--ok);background:var(--okbg)}
.srow.wrong{border-color:var(--bad);background:var(--badbg)}
.srow p{margin:0 0 8px;font-weight:600}
@media(min-width:640px){.srow.two{display:flex;align-items:center;justify-content:space-between;gap:16px}.srow.two p{margin:0}.srow.two .bk{flex:none;flex-wrap:nowrap}}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bk button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px;min-height:40px}
.bk button.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.fb{border-radius:16px;padding:12px 16px;margin:12px 0 0;font-weight:600}
.fb.good{background:var(--okbg)}
.fb.try{background:var(--badbg)}
.fb.show{background:var(--bg2)}
.fb b{display:block}
.sum{text-align:center}
.sum .big{font-size:56px}
.badge{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b);font-size:70px;box-shadow:0 6px 0 rgba(0,0,0,.2);margin:6px auto}
.recap{text-align:left;padding-left:0;list-style:none;display:grid;gap:8px}
.recap li{background:var(--bg2);border-radius:14px;padding:8px 14px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}}
</style>
</head>
