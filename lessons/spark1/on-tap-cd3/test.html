<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm Tra Hải Đăng</title>
<style>
:root{
  --fs:1;
  --bg:#e9f3f7; --bg2:#d5e9f1; --card:#fbfdfe; --card2:#f0f6f9; --ink:#1f2d3d; --ink2:#4a5d70;
  --line:#c3d6e0; --brand:#0e8f9b; --brand-ink:#ffffff; --sun:#f5a800; --ok:#23915a; --ok-bg:#dcf3e6;
  --bad:#c8374e; --bad-bg:#fbe3e7; --pick:#d9eefb; --pick-line:#2b86c5; --shadow:0 4px 0 rgba(31,45,61,.10);
  --ctl-w:208px;
}
:root[data-theme="dark"]{
  --bg:#0e1a2b; --bg2:#14263d; --card:#182b45; --card2:#1f3554; --ink:#e4edf6; --ink2:#a9bccf;
  --line:#33506f; --brand:#3cc3cf; --brand-ink:#08222a; --sun:#ffc83d; --ok:#4cc88a; --ok-bg:#16402f;
  --bad:#ff7a8d; --bad-bg:#4a2230; --pick:#1d4468; --pick-line:#5db4f0; --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:calc(20px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI","Trebuchet MS",Arial,sans-serif;line-height:1.45;overflow:hidden}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,.zone:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;border-radius:4px;padding:0 3px}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1800px;margin:0 auto;position:relative}

/* ---- controls (fixed, top-right) ---- */
#ctl{position:fixed;top:6px;right:8px;z-index:50;display:flex;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 2px;box-shadow:var(--shadow)}
#ctl button{width:48px;height:48px;border:0;background:transparent;border-radius:50%;font-size:1.15rem;font-weight:800}
#ctl button:hover{background:var(--card2)}

/* ---- HUD ---- */
.hud{padding:8px 14px 6px;padding-right:calc(var(--ctl-w) + 18px);display:grid;gap:6px;flex:none;min-height:66px}
.hud-top{display:flex;align-items:center;gap:10px;min-height:48px}
.ibtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.2rem;flex:none;box-shadow:var(--shadow)}
.hud-title{font-weight:800;font-size:1rem;line-height:1.2;min-width:0}
.hud-title small{display:block;font-weight:600;color:var(--ink2)}
.meter{grid-column:1/-1;padding:0 14px 10px;flex:none}
.meter-row{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem;margin-bottom:3px}
.track{position:relative;height:22px;border-radius:999px;background:var(--card2);border:2px solid var(--line);overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;background:linear-gradient(90deg,#ffd35a,var(--sun));transition:width .5s}
.track .lost{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--bad) 35%,transparent) 5px 8px);border-radius:0 999px 999px 0;transition:width .5s}
.track .passline{position:absolute;top:-6px;bottom:-6px;width:0;border-left:3px dashed var(--brand)}
.track .passline b{position:absolute;top:-1.15rem;left:50%;transform:translateX(-50%);font-size:.75rem;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:0 6px;white-space:nowrap}
.meter{padding-top:14px}

/* ---- main / panel / actions ---- */
main{flex:1;min-height:0;overflow:auto;padding:6px 14px 10px}
.panel[hidden]{display:none}
.panel{margin:0;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px 14px;font-size:1.05rem}
.panel.ok{border-color:var(--ok);background:var(--ok-bg)}
.panel.bad{border-color:var(--bad);background:var(--bad-bg)}
.panel .hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;margin-bottom:2px}
.panel .hint{margin:3px 0}
.panel .ghost{color:var(--ink2)}
.actions{flex:none;display:flex;gap:10px;padding:10px 14px 14px}
.btn{min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 18px;font-weight:800;box-shadow:var(--shadow)}
.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);flex:1}
.btn.hintb{background:#fff4cf;color:#5b4300;border-color:#e6bd3d}
:root[data-theme="dark"] .btn.hintb{background:#4b3d12;color:#ffe49a;border-color:#a98516}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghostb{background:transparent;box-shadow:none}

/* ---- question card ---- */
.say{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.say svg{flex:none;width:42px;height:42px}
.bubble{font-size:1.05rem !important;background:var(--card);border:2px solid var(--line);border-radius:6px 18px 18px 18px;padding:8px 12px;font-weight:600;color:var(--ink2);font-size:.95rem}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow)}
.qtext{font-size:1.4rem;line-height:1.35;font-weight:800;margin:0 0 6px}
.qhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.tts{flex:none;min-width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font-weight:700;padding:0 10px;font-size:.85rem}
.tts[disabled]{opacity:.55;cursor:not-allowed}
.how{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:700;color:var(--ink2);margin-bottom:8px}
.qimg{position:relative;display:block;width:fit-content;margin:6px auto 4px;max-width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--line);touch-action:manipulation}
.qimg.svg{width:min(100%,72vh)}
.qimg.svg.sm{width:min(100%,46vh)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.split .qimg.svg{width:min(100%,52vh);margin:0}
@media (max-width:800px){.split{grid-template-columns:1fr}}
.qimg img{display:block;max-width:100%;max-height:26vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font-weight:600}
.opt .tag{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--card);border:2px solid var(--line);font-weight:800}
.multi .opt .tag{border-radius:6px}
.opt.pick{background:var(--pick);border-color:var(--pick-line)}
.opt.pick .tag{background:var(--pick-line);color:#fff;border-color:var(--pick-line)}
.opt .ic{margin-left:auto;flex:none;width:30px;height:30px;display:none;place-items:center;color:#fff;font-weight:900}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .ic{display:grid;background:var(--ok);border-radius:50%}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .ic{display:grid;background:var(--bad);border-radius:7px;transform:rotate(45deg)}
.opt.wrong .ic i{transform:rotate(-45deg);font-style:normal}
.opt.locked{cursor:default}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:2px dashed var(--line)}
.row:first-of-type{border-top:0}
.row .rt{flex:1 1 220px;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{min-width:84px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-weight:800}
.seg button.pick{background:var(--pick);border-color:var(--pick-line)}
select.sel{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card2);padding:0 10px;font-weight:700;max-width:100%}
.row.right{border-radius:12px;background:var(--ok-bg)}
.row.wrong{border-radius:12px;background:var(--bad-bg)}
.rmark{width:30px;height:30px;display:none;place-items:center;color:#fff;font-weight:900}
.row.right .rmark{display:grid;background:var(--ok);border-radius:50%}
.row.wrong .rmark{display:grid;background:var(--bad);border-radius:7px}
.fix{flex-basis:100%;font-size:.88rem;font-weight:700;color:var(--bad)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mt .opt{font-size:.92rem}
.num{flex:none;min-width:28px;height:28px;border-radius:50%;display:none;place-items:center;background:var(--pick-line);color:#fff;font-weight:800;font-size:.85rem}
.opt.paired .num{display:grid}
.opt.sel1{outline:3px solid var(--sun)}
.zone{position:absolute;border:0;background:transparent;border-radius:6px;padding:0}
.zone:hover{outline:3px dashed var(--pick-line)}
.zone.pick{outline:4px solid var(--pick-line);background:rgba(43,134,197,.22)}
.zone.right{outline:4px solid var(--ok);background:rgba(35,145,90,.28)}
.zone.wrong{outline:4px solid var(--bad);background:rgba(200,55,78,.25)}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid var(--pick-line);background:rgba(255,255,255,.7);pointer-events:none}
.letters{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.letters .opt{min-height:48px;padding:4px 14px}

/* ---- screens ---- */
.center{max-width:none;margin:0 auto}
.narrow{max-width:760px}
.qtext.long{font-size:1.15rem;font-weight:700}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:start}
.bigmsg{font-size:1.3rem;font-weight:800;padding:24px 8px;text-align:center}
.opt{font-size:1.05rem}

.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 0}
.hero svg.house{width:min(190px,40vw);height:auto;flex:none}
.hero h1{margin:0;font-size:1.9rem;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--ink2);font-weight:600}
.chs{display:grid;gap:12px;margin-top:10px}
.ch{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:12px 14px;min-height:84px;box-shadow:var(--shadow);width:100%}
.ch .em{font-size:2.2rem;width:56px;text-align:center;flex:none}
.ch b{display:block;font-size:1.05rem}
.ch span.s{color:var(--ink2);font-size:.9rem;font-weight:600}
.ch .st{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}
.ch.off{opacity:.55;cursor:not-allowed;box-shadow:none}
.tagp{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800;background:var(--ok);color:#fff}
.tagp.no{background:var(--ink2)}
.stars{font-size:1.6rem;letter-spacing:3px;color:var(--sun)}
.stars .off{color:var(--line)}
.story{text-align:center;padding-top:6px}
.story .big{font-size:4rem;line-height:1.1}
.story .chipbox svg{width:72px;height:72px}
.story p{font-size:1.6rem;font-weight:700;margin:12px auto}
.dots{display:flex;justify-content:center;gap:8px;margin:8px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.resbox{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.lore{font-size:1.1rem;font-weight:600;line-height:1.6;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin:4px 0 12px}
.resbox svg.house{width:130px;height:auto}
.resbox .score{font-size:2.6rem;font-weight:900}
.resbox .verdict{font-size:1.2rem;font-weight:800;margin:4px 0}
.miss{text-align:left;margin-top:12px}
.miss h3{margin:0 0 6px;font-size:1.05rem}
.mi{border:2px solid var(--bad);background:var(--bad-bg);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.mi .qa{font-weight:700;font-size:.95rem}
.mi .aa{font-size:.9rem;margin-top:2px;white-space:pre-line}
.mi .aa::before{content:"✓ Đáp án: ";font-weight:800;color:var(--ok)}
.confirm{position:fixed;inset:0;background:rgba(10,20,35,.55);display:grid;place-items:center;z-index:80;padding:20px}
.confirm div{background:var(--card);border-radius:20px;padding:20px;max-width:360px;text-align:center;border:2px solid var(--line)}
.beam{transition:opacity .8s}
.lamp{flex:none;width:64px;height:64px;position:relative}
.lamp svg{width:100%;height:100%;overflow:visible}
.lamp .lit{transition:opacity 1s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.lamp.pulse{animation:flash .7s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.stars span{display:inline-block;animation:pop .5s both}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@media (max-width:560px){
  :root{--ctl-w:0px}
  #ctl{top:auto;bottom:auto}
  .hud{padding-right:14px;padding-top:62px}
  .mt{grid-template-columns:1fr}
  .hero h1{font-size:1.5rem}
}
</style>
</head>

  <button id="bFp" title="Chữ to hơn" aria-label="Tăng cỡ chữ">A+</button>
</div>
