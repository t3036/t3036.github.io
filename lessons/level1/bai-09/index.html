<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 1 – Bài 09: Tìm hiểu về kết nối mạng không dây</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ BOOT ============ -->
<div id="boot">
  <div class="term">
    <div class="term-bar"><i></i><i></i><i></i><span>Level 1 | Bài 9</span></div>
    <div class="term-body">
      <h1 style="animation:in .5s .1s forwards;opacity:0">Tìm hiểu về <em>kết nối mạng</em></h1>
      <p style="animation:in .5s .3s forwards;opacity:0">Ethernet, Wi-Fi, Bluetooth... Hãy khám phá cách các thiết bị kết nối và tự kiểm tra khi mất Internet.</p>
      <button class="btn" id="start" style="animation:in .5s .5s forwards;opacity:0">▶ Bắt đầu khám phá</button>
    </div>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div id="shell" class="hidden">
  <button id="sbToggle" class="sbtoggle" aria-label="Ẩn/hiện menu" title="Ẩn/hiện menu"></button>
  <aside>
    <div class="brand">Level 1 - BÀI 09<small>Kết nối mạng</small></div>
    <div class="xpbar"><div id="xpfill"></div></div>
    <div class="xptxt" id="xptxt">0 / 5</div>
    <div id="tabs"></div>
    <button id="resetBtn" class="resetbtn" title="Xóa tiến độ">↺ Học lại từ đầu</button>
    <button id="themeBtn" aria-label="Đổi giao diện"></button>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script src="script.js"></script>
<script>
(function(){
  var shell=document.getElementById("shell");
  function setCollapsed(c){
    shell.classList.toggle("collapsed",c);
    try{localStorage.setItem("k6b09-menu-hidden",c?"1":"0")}catch(e){}
  }
  document.getElementById("sbToggle").onclick=function(){setCollapsed(!shell.classList.contains("collapsed"))};
  try{if(localStorage.getItem("k6b09-menu-hidden")==="1")shell.classList.add("collapsed")}catch(e){}
})();
</script>
</body>
</html>
