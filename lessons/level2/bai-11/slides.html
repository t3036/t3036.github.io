<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 11 – Quy tắc ứng xử trên môi trường số (Trình chiếu tương tác)</title>
<style>
:root{
  --ink:#ffffff; --mute:#c9d2ee; --p:#e3e8f8; --acc:#ffd23f; --page:#04070f;
  --coral:#ff6b57; --mint:#2fd1ae; --sun:#ffd23f; --sky:#5b9bff; --vio:#a78bfa;
  --glass:rgba(255,255,255,.1); --scn:rgba(255,255,255,.08); --mb:rgba(255,255,255,.14);
  --cf-sky:rgba(91,155,255,.2); --cf-coral:rgba(255,107,87,.2); --cf-mint:rgba(47,209,174,.18); --cf-sun:rgba(255,210,63,.18); --cf-vio:rgba(167,139,250,.22);
  --okbg:rgba(47,209,174,.28); --nobg:rgba(255,107,87,.26); --dimop:.5; --dimbg:rgba(255,255,255,.08); --dimfg:#fff;
  --barbg:rgba(0,0,0,.4); --btn:rgba(255,255,255,.14); --track:rgba(255,255,255,.18); --menubg:rgba(5,10,25,.96);
  --lb-bg:#fff; --lb-fg:#10172e; --shadow:none; --wmop:.09; --sel:rgba(91,155,255,.35); --stagebg:#0c1530;
}
html[data-theme="light"]{
  --ink:#14203d; --mute:#46536f; --p:#2c3858; --acc:#8a5200; --page:#d9e0ee;
  --coral:#e5483a; --mint:#0f9f80; --sky:#2f6fe0; --vio:#7c5ce0; --sun:#ffc61a;
  --glass:#ffffff; --scn:#ffffff; --mb:#e8eefb;
  --cf-sky:#d2e3ff; --cf-coral:#ffd6cd; --cf-mint:#c6f1e1; --cf-sun:#ffe99c; --cf-vio:#e0d6ff;
  --okbg:#cdf3e4; --nobg:#ffdad3; --dimop:1; --dimbg:#e9ecf3; --dimfg:#4a5570;
  --barbg:rgba(20,32,61,.1); --btn:rgba(20,32,61,.1); --track:rgba(20,32,61,.16); --menubg:rgba(243,246,252,.97);
  --lb-bg:#14203d; --lb-fg:#fff; --shadow:0 3px 12px rgba(20,32,61,.16); --wmop:.11; --sel:#cfe0ff; --stagebg:#e6ebf6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
b{font-weight:800}
#stage{position:absolute;left:0;top:0;width:2120px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--stagebg)}
.view{position:absolute;left:100px;top:0;width:1920px;height:1016px;overflow:hidden;box-shadow:0 0 36px rgba(0,0,0,.4)}
.track{display:flex;height:1016px;transition:transform .55s cubic-bezier(.65,0,.25,1);will-change:transform}

/* ---------- slide + per-section colour worlds ---------- */
.slide{flex:0 0 1920px;height:1016px;padding:40px 90px 18px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--b1),var(--b2));--sc:#ffd23f}
.slide::before{content:"";position:absolute;right:-180px;top:-220px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,var(--sc) 0,transparent 68%);opacity:.28;pointer-events:none}
.slide::after{content:attr(data-wm);position:absolute;right:50px;bottom:60px;font-size:330px;line-height:1;opacity:var(--wmop);pointer-events:none;filter:saturate(1.2)}
.slide>*{position:relative;z-index:1}
.slide[data-sec="s0"]{--b1:#0f1d44;--b2:#1c3d7d;--sc:#5b9bff}
.slide[data-sec="s1"]{--b1:#2d1433;--b2:#592338;--sc:#ff6b57}
.slide[data-sec="s2"]{--b1:#0a2b2c;--b2:#10574d;--sc:#2fd1ae}
.slide[data-sec="s3"]{--b1:#2f2610;--b2:#5a4512;--sc:#ffd23f}
.slide[data-sec="s4"]{--b1:#1b1a4d;--b2:#3a3496;--sc:#a78bfa}
.slide[data-sec="s5"]{--b1:#341a14;--b2:#6a3a1d;--sc:#ff9a57}
.slide[data-sec="s6"]{--b1:#0a2b36;--b2:#115a63;--sc:#38d0d8}
.slide[data-sec="rv"]{--b1:#2c2410;--b2:#5d4a10;--sc:#ffd23f}
.slide[data-sec="st"]{--b1:#0c1530;--b2:#2e1f68;--sc:#ffd23f}
html[data-theme="light"] .slide[data-sec="s0"]{--b1:#cfe1ff;--b2:#f0f6ff;--sc:#5b9bff}
html[data-theme="light"] .slide[data-sec="s1"]{--b1:#ffd5cb;--b2:#fff0ec;--sc:#ff7d6b}
html[data-theme="light"] .slide[data-sec="s2"]{--b1:#c3f1e2;--b2:#eefbf6;--sc:#2fd1ae}
html[data-theme="light"] .slide[data-sec="s3"]{--b1:#ffe9a1;--b2:#fff8dd;--sc:#ffc61a}
html[data-theme="light"] .slide[data-sec="s4"]{--b1:#dcd2ff;--b2:#f3efff;--sc:#a78bfa}
html[data-theme="light"] .slide[data-sec="s5"]{--b1:#ffdcc0;--b2:#fff3e6;--sc:#ff9a57}
html[data-theme="light"] .slide[data-sec="s6"]{--b1:#bdeeee;--b2:#ebfafa;--sc:#38d0d8}
html[data-theme="light"] .slide[data-sec="rv"]{--b1:#ffe38f;--b2:#fff6d3;--sc:#ffc61a}
html[data-theme="light"] .slide[data-sec="st"]{--b1:#cfdcff;--b2:#efe3ff;--sc:#ffc61a}

/* ---------- header ---------- */
.sh{display:flex;align-items:center;gap:22px;margin-bottom:20px;min-height:84px}
.tag{flex:none;font-size:23px;font-weight:800;padding:6px 20px;border-radius:99px;background:var(--sc);color:#111;white-space:nowrap}
.sh h2{font-size:62px;line-height:1.1;margin:0;letter-spacing:-.5px}
.sh .ex{margin-left:auto;display:flex;gap:12px;align-items:center}
.chip{font-size:23px;font-weight:800;border:3px solid var(--sc);border-radius:99px;padding:3px 18px;color:var(--ink);white-space:nowrap;background:var(--glass)}
.chip.f{background:var(--sun);color:#111;border-color:var(--sun)}
.chip.scr{background:var(--mint);color:#fff;border-color:var(--mint)}
html:not([data-theme="light"]) .chip.scr{color:#06281f}

/* ---------- body ---------- */
.body{flex:1;min-height:0;font-size:34px;line-height:1.38;overflow:hidden;display:flex;flex-direction:column;gap:.55em}
mark{background:rgba(255,210,63,.38);color:inherit;padding:0 .12em;border-radius:.18em;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.c{background:var(--coral);color:#fff}
mark.m{background:var(--mint);color:#06281f}
html[data-theme="light"] mark.m{background:#0b7a62;color:#fff}
html[data-theme="light"] mark.c{background:#c2301f}
.rvb{opacity:0;transition:opacity .4s,transform .4s;transform:translateY(12px)}
.rvb.on{opacity:1;transform:none}
.measure .rvb{transform:none !important;transition:none !important}
.big{font-size:1.2em;line-height:1.3}
.center{text-align:center}

/* ---------- cards ---------- */
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-auto-rows:minmax(0,560px);align-content:center;gap:.6em;flex:1;min-height:0}
.card{background:var(--cf,var(--glass));border-top:.22em solid var(--cc,var(--sky));border-radius:.6em;padding:.7em .85em;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.25em;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.card .ic{font-size:3.6em;line-height:1.1}
.card h3{font-size:1.4em;margin:0;line-height:1.2}
.card p{font-size:1.05em;color:var(--p);line-height:1.3}
.cc-sky{--cc:var(--sky);--cf:var(--cf-sky)} .cc-coral{--cc:var(--coral);--cf:var(--cf-coral)} .cc-mint{--cc:var(--mint);--cf:var(--cf-mint)} .cc-sun{--cc:var(--sun);--cf:var(--cf-sun)} .cc-vio{--cc:var(--vio);--cf:var(--cf-vio)}
.remember{background:rgba(255,210,63,.18);border:.1em dashed var(--sun);border-radius:.55em;padding:.3em .8em;font-weight:700;text-align:center}
html[data-theme="light"] .remember{background:#fff3c4}
.remember::before{content:"🧠 ";}
.body:has(.cards ~ .remember){justify-content:center}
.cards:has(~ .remember){flex:none;grid-auto-rows:minmax(0,400px)}
.body:has(.eq ~ .big){justify-content:center}
.eq:has(~ .big){flex:none}
.big{transition:opacity .5s,transform .5s}
.eq:has(.lk:not(.open)) ~ .big{opacity:0;transform:translateY(10px)}
.remember{transition:opacity .5s,transform .5s}
.cards:has(.lk:not(.open)) ~ .remember{opacity:0;transform:translateY(10px)}

/* equation */
.eq{display:flex;align-items:center;justify-content:center;gap:.5em;flex:1;min-height:0}
.eq .t{flex:1;max-width:30%;background:var(--cf,var(--glass));border:.12em solid var(--cc);border-radius:.8em;padding:.5em .4em;text-align:center;font-weight:800;box-shadow:var(--shadow)}
.eq .t .ic{font-size:2.8em;line-height:1.1;display:block}
.eq .t small{display:block;font-size:.55em;font-weight:600;color:var(--p)}
.eq .op{font-size:2em;font-weight:800;color:var(--acc)}
.eq .t.r{background:var(--sun);color:#10172e;--cc:var(--sun)}
.eq .t.r small{color:#3a3320}

/* route (roadmap) */
.route{display:flex;align-items:center;justify-content:space-between;flex:1;min-height:0;position:relative;padding-top:1.2em}
.stn{flex:1;text-align:center;position:relative}
.stn::before{content:"";position:absolute;top:2.72em;left:-50%;width:100%;height:.3em;background:repeating-linear-gradient(90deg,var(--acc) 0 .6em,transparent .6em 1.1em);opacity:.75;z-index:0}
.stn:first-child::before{display:none}
.stn .c{position:relative;z-index:1}
.stn .c{width:3.4em;height:3.4em;margin:0 auto;border-radius:50%;background:var(--cc);display:grid;place-items:center;font-size:1.6em;box-shadow:var(--shadow),0 0 0 .2em var(--ink) inset;color:#111}
.stn .c span{font-size:1.5em}
.stn b{display:block;margin-top:.35em;font-size:.95em;line-height:1.15}
.stn small{display:block;font-weight:800;color:var(--acc);font-size:.85em}

/* ---------- title slide ---------- */
.title{display:flex;flex:1;flex-direction:row;align-items:center;gap:60px;justify-content:space-between}
.title .tx{flex:1}
.title .k{display:inline-block;font-size:28px;font-weight:800;background:var(--sun);color:#111;border-radius:99px;padding:6px 26px}
.title h1{font-size:110px;line-height:1.05;margin:.15em 0;letter-spacing:-2px}
.title h1 em{font-style:normal;color:var(--acc)}
.title p{font-size:1.1em;color:var(--mute)}
.title .ph{flex:none;width:560px;font-size:30px;transform:rotate(3deg)}

/* ---------- mock devices & scenes ---------- */
.phone{background:var(--scn);border:.2em solid var(--ink);border-radius:1.1em;overflow:hidden;box-shadow:var(--shadow),0 .5em 2em rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0}
.ph-top{display:flex;align-items:center;gap:.5em;padding:.4em .7em;background:var(--sc);color:#111;font-weight:800}
.ph-top .av{background:#fff}
.ph-body{padding:.5em;display:flex;flex-direction:column;gap:.45em;flex:1;min-height:0}
.ph-in{margin:.3em .5em .5em;padding:.2em .8em;border-radius:99px;background:var(--mb);color:var(--mute);font-size:.8em}
.av{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--mb);display:grid;place-items:center;font-size:1.1em;line-height:1}
.m{display:flex;gap:.45em;align-items:flex-end;max-width:92%;position:relative}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.mb{background:var(--mb);border-radius:.8em;padding:.25em .7em;font-size:.88em;line-height:1.25}
.m.me .mb{background:var(--sky);color:#fff}
.mb small{display:block;font-size:.65em;font-weight:800;color:var(--p);opacity:.9}
.m.me .mb small{color:#e7efff}

.scene{background:var(--scn);border-radius:.8em;padding:.5em;min-height:0;box-shadow:var(--shadow)}

.mail{background:var(--scn);border:.15em solid var(--ink);border-radius:.8em;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);font-size:1.3em;justify-content:flex-start}
.mail .tb{display:flex;gap:.3em;align-items:center;padding:.3em .6em;background:var(--mb);font-weight:700;font-size:.8em}
.mail .tb i{width:.7em;height:.7em;border-radius:50%;display:inline-block}
.mail .row{display:flex;gap:.6em;padding:.45em .7em;border-bottom:1px solid rgba(128,128,128,.25);align-items:center}
.mail .row>b{flex:none;width:4.2em;font-size:.8em;color:var(--p)}
.mail .row>span{flex:1;min-width:0}
.mail .bd{padding:.5em .7em;line-height:1.35;display:flex;flex-direction:column;gap:.5em;flex:1;justify-content:space-around}
.mail .att{display:inline-flex;gap:.3em;background:var(--mb);border-radius:.5em;padding:.1em .6em;font-size:.85em;align-self:flex-start}

.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.45em;height:100%}
.tile{background:var(--mb);border-radius:.7em;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:.2em;min-height:0;text-align:center}
.tile .face{font-size:2.6em;line-height:1.1}
.tile .nm{position:absolute;left:.4em;bottom:.2em;font-size:.6em;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:.4em;padding:0 .4em}
.tile .st{position:absolute;left:.4em;top:.2em;font-size:.7em}
.tile.pres{background:var(--sc);color:#111}

.bot{background:var(--scn);border-radius:.8em;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.bot .bh{background:var(--vio);color:#fff;padding:.3em .8em;font-weight:800}
.bot .ub{margin:.6em;background:var(--sky);color:#fff;border-radius:.8em;padding:.5em .8em;line-height:1.7}
.frag{border-radius:.25em;padding:0 .12em;cursor:pointer;border-bottom:.1em dotted rgba(255,255,255,.8);transition:background .2s}
.frag:hover{background:rgba(255,255,255,.3)}
.frag.red{background:#10172e;color:#10172e;border-bottom-color:transparent;position:relative}
.frag.red::after{content:"🔒";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.7em}
.post{background:var(--scn);border-radius:.8em;padding:.6em .8em;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.4em}
.post .ph1{display:flex;align-items:center;gap:.5em;font-weight:800}
.post .img{background:var(--mb);border-radius:.6em;display:grid;place-items:center;font-size:3.6em;padding:.15em}
.post .acts{display:flex;gap:1em;font-size:.8em;color:var(--p)}

/* ---------- hot spots (hunt) ---------- */
.hunt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.8em;flex:1;min-height:0}
.hunt .scene{display:flex;flex-direction:column;min-height:0}
.hunt .scene>*{flex:1;min-height:0}
.hot{cursor:pointer;transition:outline-color .2s,background .2s,transform .15s;outline:.1em dashed transparent;outline-offset:.1em;border-radius:.6em}
.hot:hover{outline-color:var(--acc);transform:scale(1.015)}
.hot.found.isbad{outline:.14em solid var(--coral);background:var(--nobg)}
.hot.found.isok{outline:.14em solid var(--mint);background:var(--okbg)}
.hot.found::before{position:absolute;right:-.3em;top:-.5em;font-size:1.1em;z-index:3}
.hot.found.isbad::before{content:"🚩"}
.hot.found.isok::before{content:"✅"}
.hot{position:relative}
.finds{background:var(--cf-sun);border-radius:.8em;padding:.5em .8em;display:flex;flex-direction:column;gap:.3em;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.fh{display:flex;justify-content:space-between;font-weight:800;font-size:1.05em}
.fh .cnt{background:var(--sun);color:#111;border-radius:99px;padding:0 .6em}
.fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3em;font-size:.98em;line-height:1.25}
.fl li{background:var(--glass);border-left:.25em solid var(--mint);border-radius:.4em;padding:.15em .5em;animation:pop .35s}
.fl li.b{border-left-color:var(--coral)}
.fhint{font-size:.9em;color:var(--p);margin-top:auto}
.hunt.win .fhint::after{content:" 🎉 Tuyệt vời!"}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.25em)}75%{transform:translateX(.25em)}}
.shake{animation:shake .35s}

/* ---------- sort game ---------- */
.sortg{display:flex;flex-direction:column;gap:.4em;flex:1;min-height:0}
.sortg .sgh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sc{background:var(--cf,var(--glass));border-top:.22em solid var(--cc,var(--sky));border-radius:.6em;padding:.5em .6em;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:.2em;min-height:0;overflow:hidden;transition:background .3s,border-color .3s;box-shadow:var(--shadow)}
.sc .ic{font-size:3.2em;line-height:1.1}
.sc .tx{font-weight:700;font-size:1.05em;line-height:1.2}
.sbs{display:flex;flex-direction:column;gap:.25em;width:100%}
.sb{border:.1em solid var(--ink);background:var(--glass);border-radius:99px;padding:.05em .5em;font-weight:800;font-size:.85em;transition:.2s}
.sb:hover{background:var(--sun);color:#111;border-color:var(--sun)}
.sb.y{border-color:var(--mint)} .sb.n{border-color:var(--coral)}
.sn{font-size:.72em;min-height:2.6em;opacity:0;transition:opacity .3s;line-height:1.2}
.sc.ans .sn{opacity:1}
.sc.ans .sb{pointer-events:none;opacity:.35}
.sc.ans .sb.good{opacity:1;background:var(--mint);color:#fff;border-color:var(--mint)}
.sc.ans .sb.bad{opacity:1;background:var(--coral);color:#fff;border-color:var(--coral)}
html:not([data-theme="light"]) .sc.ans .sb.good{color:#06281f}
.sc.right{background:var(--okbg);border-color:var(--mint)}
.sc.wrong{background:var(--nobg);border-color:var(--coral)}

/* ---------- match ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;flex:1;min-height:0;align-content:center}
.match .col{display:flex;flex-direction:column;gap:.5em;justify-content:center}
.match .mt{height:3.4em;flex:none}
.match .mt:not(.ok):not(.sel){background:color-mix(in srgb,var(--cf) 45%,transparent);border-color:color-mix(in srgb,var(--cc) 50%,transparent)}
.mt{display:flex;align-items:center;gap:.6em;background:var(--cf,var(--glass));border:.12em solid var(--cc,var(--sky));border-radius:.7em;padding:.4em .8em;font-weight:700;transition:.2s;text-align:left;box-shadow:var(--shadow)}
.mt .ic{font-size:1.9em}
.match{padding:.4em}
.mt:hover{transform:scale(1.02)}
.mt.sel{background:var(--sel);outline:.12em solid var(--sky)}
.mt.ok{background:var(--okbg);border-color:var(--mint);pointer-events:none}
.mt.ok::after{content:" ✔";margin-left:auto;color:var(--mint);font-size:1.2em}

/* ---------- choose (scenario) ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1em;flex:1;min-height:0}
.split>.sceneBox{display:flex;flex-direction:column;justify-content:center;min-height:0}
.chs{display:flex;flex-direction:column;justify-content:center;gap:.4em;min-height:0}
.chq{font-weight:800;font-size:1.1em;margin-bottom:.1em}
.ch{display:flex;gap:.6em;align-items:flex-start;text-align:left;background:var(--glass);border:.12em solid var(--ink);border-radius:.7em;padding:.35em .7em;transition:.2s;box-shadow:var(--shadow);line-height:1.25}
.ch .l{flex:none;width:1.45em;height:1.45em;border-radius:.4em;background:var(--lb-bg);color:var(--lb-fg);display:grid;place-items:center;font-size:.85em;font-weight:800;margin-top:.1em}
.ch:hover{transform:translateX(.2em);border-color:var(--acc)}
.ch.right{background:var(--okbg);border-color:var(--mint);pointer-events:none}
.ch.bad{background:var(--nobg);border-color:var(--coral);pointer-events:none;opacity:.8}
.fbk{min-height:2.7em;font-weight:700;font-size:.9em;border-radius:.6em;padding:.2em .7em;line-height:1.25}
.fbk.g{background:var(--okbg)} .fbk.r{background:var(--nobg)}

/* ---------- checklist (before posting) ---------- */
.chkw{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1em;flex:1;min-height:0}
.ckl{display:flex;flex-direction:column;gap:.35em;justify-content:center}
.ck{display:flex;align-items:center;gap:.6em;background:var(--glass);border:.12em solid var(--ink);border-radius:.7em;padding:.3em .7em;text-align:left;font-weight:700;transition:.2s;box-shadow:var(--shadow)}
.ck .box{flex:none;width:1.3em;height:1.3em;border-radius:.3em;border:.12em solid var(--ink);display:grid;place-items:center;font-size:.9em}
.ck.on{background:var(--okbg);border-color:var(--mint)}

.ck.on .box::after{content:"✓"}
.ck small{font-weight:500;color:var(--p)}
.postbtn{margin-top:.3em;border:0;border-radius:.6em;padding:.3em 1em;font-weight:800;background:#9aa3b8;color:#fff;font-size:1.1em;transition:.3s}
.postbtn.ready{background:var(--mint);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* ---------- question layout ---------- */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:.6em;flex:1;min-height:0}
.qleft{min-height:0;overflow:hidden;background:var(--glass);border-radius:.7em;padding:.6em .9em;font-size:1.1em;box-shadow:var(--shadow);display:flex;flex-direction:row;align-items:center;gap:.8em}
.qic{flex:none;width:2em;height:2em;border-radius:.7em;background:var(--sc);display:grid;place-items:center;font-size:1.6em;box-shadow:var(--shadow)}
.qtxt{min-height:0;flex:1;line-height:1.4;text-align:justify}
.opt>span:not(.l),.tfr .rt{text-align:justify}
.qtxt mark{background:none;padding:0;font-weight:700}
.qtxt mark.yes,.qtxt mark.no{white-space:nowrap}
.qtxt mark.yes{color:#0b9c7a}
.qtxt mark.no{color:#e0412e}
html[data-theme] .qtxt mark.yes,html[data-theme] .qtxt mark.no{background:none}

.qright{min-height:0;display:flex;flex-direction:column;justify-content:center;font-size:1.04em}
.opts{display:grid;grid-template-columns:1fr;gap:.5em}
.opts.tf{grid-template-columns:1fr}
.opt.long{grid-column:1/-1}
.opt mark,.tfr mark{background:transparent;font-weight:inherit;transition:background .3s,font-weight .3s}
.opt.sel mark,.tfr:has(.tb.pick) mark{font-weight:700;background:rgba(224,65,46,.28)}
.opt.sel.ok mark,.tfr.ok:has(.tb[data-v="1"].pick) mark,.tfr.no:has(.tb[data-v="0"].pick) mark{background:rgba(11,156,122,.3)}

.opt .l{flex:none;width:1.45em;height:1.45em;border-radius:.4em;background:var(--lb-bg);color:var(--lb-fg);display:grid;place-items:center;font-size:.85em;font-weight:800;margin-top:.1em}
.opt:hover{border-color:var(--acc)}

.opt.sel .l{background:var(--sky);color:#fff}

.slide.rev .opt.ok{background:var(--okbg);border-color:var(--mint)}
.slide.rev .opt.ok .l{background:#0b7a62;color:#fff}
.slide.rev .opt.no{opacity:var(--dimop);background:var(--dimbg);color:var(--dimfg);border-color:transparent}
.slide.rev .opt.no.sel{opacity:1;border-color:var(--coral);background:var(--nobg);color:var(--ink)}
.slide.rev .opt.sel::after{content:"👤 bạn chọn";position:absolute;right:.6em;top:-.55em;font-size:.55em;font-weight:800;background:var(--sky);color:#fff;border-radius:99px;padding:0 .6em}
.tfr{display:flex;gap:.7em;align-items:center;background:var(--glass);border-radius:.6em;padding:.35em .7em;border:.12em solid transparent;transition:.25s;box-shadow:var(--shadow)}
.tfr .rt{flex:1;line-height:1.28}
.tfb{display:flex;gap:.3em;flex:none}
.tb{border:.1em solid var(--ink);background:var(--glass);border-radius:50%;width:2em;height:2em;padding:0;display:grid;place-items:center;font-weight:800;font-size:1em;line-height:1}
.tb:hover{background:var(--sun);color:#111;border-color:var(--sun)}
.tb.pick{background:var(--sky);color:#fff;border-color:var(--sky)}
.slide.rev .tb{pointer-events:none;opacity:.5}
.slide.rev .tfr.ok{background:var(--okbg);border-color:var(--mint)}
.slide.rev .tfr.no{background:var(--nobg);border-color:var(--coral)}
.slide.rev .tfr.ok .tb.c{opacity:1;background:#0b7a62;color:#fff;border-color:#0b7a62}

.slide.rev .qbar .qpre{display:none}
.rb{border:0;background:var(--sun);color:#111;font-weight:800;border-radius:99px;padding:.1em .9em;font-size:.95em;flex:none}
.res{font-weight:800;margin-right:.4em}
