<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Trắc nghiệm đạo văn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background: linear-gradient(135deg, #74ebd5, #9face6); display: flex; justify-content: center; align-items: center;">
    <div class="card" style="width: 100%; max-width: 800px; animation: fadeIn 0.5s ease;">
        <div class="card-body">
            <h1 class="card-title text-center">Trắc Nghiệm Đạo Văn</h1>
            <h6 class="card-subtitle mb-2 text-body-secondary text-center">Đánh giá xem tình huống có phải đạo văn hay không</h6>
            
            <div class="question-number" id="question-number"></div>
            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next-btn" id="next-btn">Câu tiếp theo ➜</button>
            
            <!-- <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
            <a href="#" class="card-link">Card link</a>
            <a href="#" class="card-link">Another link</a> -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
