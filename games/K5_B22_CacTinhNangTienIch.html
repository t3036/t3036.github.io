<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⌨️ Trợ thủ tiện ích – Bài 22</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf4e2; --card:#fffdf6; --ink:#27323a; --muted:#6b7780;
  --teal:#0e7c86; --teal-d:#0a5a62; --orange:#f08a24; --red:#d6453d; --green:#2e9e5b; --violet:#6b4fc8;
  --line:#e3d7b8; --shadow:0 4px 0 rgba(39,50,58,.12);
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:1.1rem;line-height:1.5;
  background-image:radial-gradient(#eadfbf 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:18px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:1.5rem;color:var(--teal-d)}
.stars{font-weight:800;color:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* bản đồ nhiệm vụ */
.map{display:flex;gap:6px;margin-bottom:14px}
.map button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 2px;font-size:1rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.map button .n{font-size:1.2rem}
.map button.cur{border-color:var(--teal);color:var(--teal-d);background:#e3f4f5}
.map button.done{border-color:var(--green);color:var(--green);background:#e8f6ed}
.map button:disabled{opacity:.45;cursor:not-allowed}

/* bố cục: hướng dẫn bên trái + nội dung */
.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.layout.solo{grid-template-columns:1fr}
.howto{position:sticky;top:12px;background:#fff8e1;border:3px solid var(--orange);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.howto h3{color:#9a5200;font-size:1.35rem}
.howto ol{padding-left:24px;margin:10px 0}
.howto li{margin-bottom:8px}
.howto .tip{margin-bottom:0;background:#fff}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.howto{position:static}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.brief{margin-bottom:16px}
.brief .bh{display:flex;align-items:center;gap:12px}
.brief .badge{font-size:2rem;line-height:1;flex:0 0 auto}
.brief h2{color:var(--teal-d);font-size:1.45rem}
.brief p{background:#fff1c9;border-left:6px solid var(--orange);color:var(--ink);font-weight:800;padding:8px 14px;border-radius:10px;margin:8px 0 0}
.brief p::before{content:'👉 '}

.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:800;box-shadow:0 4px 0 var(--teal-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 #b9650f}
.btn.ghost{background:#fff;color:var(--teal-d);border:2px solid var(--teal);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;display:none}
.fb.show{display:block}
.fb.ok{background:#e3f6ea;border:2px solid var(--green)}
.fb.no{background:#fde8e6;border:2px solid var(--red)}
.fb.info{background:#e3f4f5;border:2px solid var(--teal)}
.tip{background:#fff3d6;border-left:6px solid var(--orange);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:1rem}
.prog{height:12px;border-radius:6px;background:#e5e5e5;margin:0 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}

/* thẻ & chip & ô phân loại */
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow);color:var(--ink)}
.chip.sel{border-color:var(--orange);background:#fff1dd;transform:translateY(-2px)}
.chip.good{border-color:var(--green);background:#e3f6ea}
.chip.bad{border-color:var(--red);background:#fde8e6}
.pool{display:flex;gap:10px;flex-wrap:wrap;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
.pool.empty::after{content:'✔ Đã đặt hết thẻ';color:var(--muted);font-weight:700;align-self:center}
.bins{display:grid;gap:12px}
.bins.c2{grid-template-columns:1fr 1fr}.bins.c3{grid-template-columns:repeat(3,1fr)}
.bin{border:3px solid var(--teal);border-radius:16px;padding:14px;min-height:130px;background:#f2fbfb;text-align:left;color:var(--ink);cursor:pointer}
.bin:nth-child(2){border-color:var(--orange);background:#fff8ee}
.bin:nth-child(3){border-color:var(--violet);background:#f4f0ff}
.bin.hot{outline:3px dashed var(--orange);outline-offset:2px}
.bin.over{filter:brightness(.95)}
.bin h3{font-size:1.1rem}
.bin small{display:block;font-size:1rem;color:var(--muted);margin-bottom:8px}
.bin .in{display:flex;gap:6px;flex-wrap:wrap;min-height:36px}
.bin .chip{padding:5px 12px;box-shadow:none;text-align:left;border-radius:14px}
@media(max-width:700px){.bins.c2,.bins.c3{grid-template-columns:1fr}.map button span.l{display:none}}
.hint{color:var(--muted);font-size:1rem;margin:-4px 0 10px}

/* chạm vào trang web */
.clue-q{background:var(--teal);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:800}
.clue-q.pop{animation:cluepop .45s}
@keyframes cluepop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.tapz{cursor:pointer;border-radius:8px;transition:.15s}
.tapz:hover{outline:3px dashed var(--orange);outline-offset:2px}
.tapz.good{outline:3px solid var(--green);outline-offset:2px;background:#e3f6ea}
.tapz.bad{outline:3px solid var(--red);outline-offset:2px;background:#fde8e6;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tapbox{border:2px solid #cfd6da;border-radius:12px;padding:12px;background:#fff;margin-bottom:10px}
.tapbox .tapz{padding:6px 10px;margin:4px 0}
.cite-line{font-family:'Noto Serif','Times New Roman',serif;font-size:1.1rem;background:#fff;border:3px solid var(--teal);border-radius:14px;padding:10px 16px;min-height:3rem;margin-bottom:12px}
.cite-line span.p{background:#e3f6ea;border-radius:6px;padding:0 4px;animation:cluepop .45s}
.cite-line em{color:var(--muted);font-style:normal;font-family:'Nunito',sans-serif}

/* trắc nghiệm */
.qtext{font-size:1.4rem;font-weight:800;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px;font-weight:700;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--orange);background:#fff1dd}
.opt.good{border-color:var(--green);background:#e3f6ea}
.opt.bad{border-color:var(--red);background:#fde8e6}
.tfrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff}
.tfrow .s{flex:1;min-width:240px}
.tfrow.good{border-color:var(--green);background:#e3f6ea}
.tfrow.bad{border-color:var(--red);background:#fde8e6}
.scn{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff}
.scn .row{margin-top:6px}
.scn.right{border-color:var(--green);background:#f1fbf4}

/* câu văn có thể chạm */
.essay{background:#fff;border:2px solid #cfd6da;border-radius:14px;padding:14px 18px}
.essay .sent{display:block;margin-bottom:8px;padding:6px 10px;border-radius:8px;border:2px dashed #cfd6da;cursor:pointer}
.essay .sent:hover{background:#f3f0ff}
.essay .sent small{display:block;color:var(--violet);font-weight:700}
.essay .sent.flag{background:#ffe08a;border-color:var(--orange)}
.essay .sent.right{background:#fcc;border:2px solid var(--red)}
.essay .sent.ok{background:#e3f6ea;border:2px solid var(--green)}
.howsel{display:flex;gap:14px;align-items:center;background:#fff;border:3px dashed var(--orange);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.howsel .hand{font-size:2.6rem;animation:tap 1.2s infinite}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.howsel .cnt{margin-left:auto;background:var(--teal);color:#fff;border-radius:99px;padding:6px 16px;font-weight:800;white-space:nowrap}

/* flashcard: mỗi thẻ một hàng */
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.fc{border:3px solid var(--teal);border-radius:18px;background:#fff;min-height:96px;padding:14px 22px;display:flex;flex-direction:row;align-items:center;gap:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.fc .em{font-size:2.6rem;line-height:1.1;flex:0 0 auto}
.fc h3{font-size:1.4rem;color:var(--teal-d);margin:0;flex:1}
.fc small{color:var(--muted);font-size:1rem;flex:0 0 auto}
.fc.locked{opacity:.55;border-style:dashed;border-color:#b8ad8c;cursor:not-allowed}
.fc.read{border-color:var(--green)}
.fc.back{background:#fff8e1;border-color:var(--orange);flex-direction:column;align-items:stretch;gap:0;padding:18px 22px;cursor:default}
.fc.back p{margin:0 0 10px}
.fc.back .eg{background:#fff;border-radius:10px;padding:8px 12px;border-left:5px solid var(--teal);margin-bottom:12px}
@media(max-width:700px){.fc{flex-wrap:wrap}}

/* hình minh họa trong thẻ */
.vwrap{margin-bottom:14px}
.vgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:18px;align-items:center}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.vcard{background:#fff;border:2px solid #cfd6da;border-radius:12px;padding:14px}
.legend .lg{display:flex;gap:6px;align-items:flex-start;margin-bottom:10px}
.nb{display:inline-flex;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;align-items:center;justify-content:center;flex:0 0 auto;margin:0 4px;vertical-align:middle}
.steps{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.steps .st{flex:1;min-width:170px}
.steps .ar{align-self:center;font-size:1.6rem;color:var(--teal-d);font-weight:800}
.vbox{border:3px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;background:#fff}
.vbox.ok{border-color:var(--green);background:#e3f6ea}
.vbox.no{border-color:var(--red);background:#fde8e6}
.vbox.te{border-color:var(--teal);background:#e3f4f5}
.vbox .big{font-size:2.2rem;line-height:1.1}
.vbox{overflow-wrap:anywhere;word-break:break-word}
.vside{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px;align-items:start}
@media(max-width:900px){.vside{grid-template-columns:1fr}}
.vside .cites{display:grid;gap:10px}
.vside .win{margin-bottom:0}
.navhl{background:#fff;color:var(--teal-d);border-radius:8px;padding:2px 10px;outline:3px solid var(--orange)}
.authbox{display:flex;gap:12px;align-items:center;border-radius:10px;padding:10px 12px;margin:8px 0;outline:3px solid var(--orange);background:#fff1dd}
.authbox .av{font-size:2.4rem}
.by{color:var(--muted)}
[hidden]{display:none!important}
.cites .vbox{cursor:pointer;transition:.15s}
.cites .vbox:hover{border-color:var(--orange)}
.cites .vbox.on{border-color:var(--orange);background:#fff1dd;box-shadow:0 3px 0 var(--orange)}
.slide{background:#fff;border:2px solid #cfd6da;border-radius:12px;padding:16px 18px;box-shadow:0 4px 0 rgba(39,50,58,.1)}
.slide h4{margin:0 0 8px;font-family:'Baloo 2',sans-serif}
.slide .quote{font-family:'Noto Serif','Times New Roman',serif;font-size:1.3rem;font-style:italic;padding:8px 0}
.srcline{margin-top:8px;padding:6px 12px;border-radius:8px;background:#fff1dd;outline:3px solid var(--orange);font-weight:600}
.vpanel>.win+.srcline{margin-top:0}
.bars{display:flex;gap:18px;align-items:flex-end;height:110px;border-bottom:2px solid var(--ink);padding:0 10px;justify-content:space-around;text-align:center;font-size:.9rem}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--teal);border-radius:6px 6px 0 0;margin-bottom:2px}
.news{background:#f6f1e3;border:2px solid #cdbf93;border-radius:8px;padding:10px 14px;font-family:'Noto Serif','Times New Roman',serif}
.news .nh{font-weight:700;letter-spacing:2px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.news .ln{height:8px;border-radius:4px;background:#d9cfae;margin:7px 0}.news .ln.s{width:70%}
.hl{outline:3px solid var(--orange);background:#fff1dd;border-radius:6px;padding:0 6px}
.cap{text-align:center;font-weight:800;color:var(--teal-d);margin-top:10px}
.bk{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:'Noto Serif','Times New Roman',serif}
.bk-cover{position:relative;width:240px;min-height:330px;background:linear-gradient(145deg,#2a6f93,#10405c);color:#fff3d0;border-radius:3px 10px 10px 3px;padding:26px 20px 18px 40px;box-shadow:8px 10px 0 rgba(39,50,58,.22),inset -5px 0 0 rgba(255,255,255,.15);border-right:6px solid #efe4c4;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.bk-cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,#0a2d42,#1a5476);border-right:2px solid rgba(255,255,255,.2);border-radius:3px 0 0 3px}
.bk-cover .au{letter-spacing:2px;text-transform:uppercase;font-size:.95rem}
.bk-cover .ti{font-size:2rem;font-weight:700;color:#ffd978;line-height:1.2;margin:10px 0}
.bk-cover .orn{font-size:2.4rem}
.bk-cover .pb{font-size:.95rem;border-top:1px solid rgba(255,255,255,.35);padding-top:8px}
.bk .hl{background:transparent;color:inherit;display:inline-block;padding:0 8px}
.bk-cover .tapz{display:block;padding:3px 6px}
.bk-cover .tapz.good{color:var(--ink)}
.bk-page{width:260px;min-height:330px;background:#fffdf4;border:1px solid #d9cfae;border-radius:6px;padding:20px 20px 14px;box-shadow:8px 10px 0 rgba(39,50,58,.12);font-size:.95rem;color:#4a4430;display:flex;flex-direction:column;gap:8px}
.bk-page h5{margin:0 0 4px;text-align:center;font-size:1rem;letter-spacing:1px;text-transform:uppercase;color:#8a7c4f;border-bottom:1px solid #e6dcb8;padding-bottom:6px}
.bk-page .tapz{padding:3px 6px}
.bk-page .ft{margin-top:auto;font-size:.8rem;color:#9b916f;text-align:center}
.paper{background:#fff;border:2px solid #cfd6da;border-radius:6px;padding:14px 18px;box-shadow:inset 0 0 0 4px #f4f6f7}
.paper .fn{border-top:2px solid var(--ink);margin-top:20px;padding-top:6px;font-size:1rem;width:70%}
.paper .ln{height:9px;border-radius:5px;background:#e3e7e9;margin:8px 0}
.paper .ln.s{width:70%}
.sup{color:var(--red);font-weight:800}
.chat{border:2px solid #cfd6da;border-radius:18px;overflow:hidden;background:#fff}
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid #e3e7e9;background:#f8f9fb}
.cav{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.cbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.bub{border-radius:4px 18px 18px 18px;padding:8px 14px;background:#f4f4f8}
.bub.u{align-self:flex-end;background:#e8f0fe;border-radius:18px 18px 4px 18px}

/* cửa sổ trình duyệt giả */
.win{border:2px solid #8e9aa1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(39,50,58,.12);font-size:1rem;margin-bottom:12px}
.wtop{background:#cfd6da;display:flex;align-items:flex-end;gap:10px;padding:8px 10px 0}
.tl{display:flex;gap:6px;align-self:center;padding-bottom:6px}
.tl i{width:12px;height:12px;border-radius:50%;display:block;background:#ff5f57}
.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.wtab{background:#f4f6f7;border-radius:10px 10px 0 0;padding:6px 12px;display:flex;gap:8px;align-items:center;max-width:62%;min-width:0}
.wtab .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.wtool{background:#f4f6f7;display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid #d5dade}
.wtool .nv{color:#5c676e;font-weight:800}
.waddr{flex:1;min-width:0;background:#fff;border:1px solid #d5dade;border-radius:99px;padding:3px 14px;color:#4a555c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:#0e7c86;color:#fff;font-weight:700}
.sh b{font-size:1.15rem;margin-right:auto}
.sh .tapz{padding:2px 10px}
.art{padding:12px 16px}
.art h4{margin:0 0 4px;font-size:1.3rem;font-family:'Baloo 2',sans-serif}
.sf{background:#eef2f3;border-top:1px solid #d5dade;padding:8px 16px;color:#4a555c}
.mail{border:2px solid #cfd6da;border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden}
.mail .mh{background:#f4f6f7;padding:8px 14px;border-bottom:1px solid #e3e7e9}
.mail .mb{padding:10px 14px}
.picpost{border:2px solid #cfd6da;border-radius:12px;background:#fff;overflow:hidden;margin-bottom:12px}
.picpost .pic{background:linear-gradient(135deg,#a8e0b0,#7fb8e8);text-align:center;font-size:3rem;padding:16px}
.picpost .pc{padding:8px 14px}

/* cửa sổ nổi bài tập nhỏ */
.modal-back{position:fixed;inset:0;background:rgba(20,30,35,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:20px;max-width:920px;width:100%;max-height:92vh;overflow:auto;border:4px solid var(--teal);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .mh{background:var(--teal);color:#fff;padding:14px 20px;font-weight:800;font-size:1.35rem;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.modal .mx{background:rgba(255,255,255,.2);color:#fff;border:2px solid #fff;border-radius:10px;padding:4px 12px;font-weight:800}
.modal .mb{padding:18px 22px}
.modal .mi{background:#fff3d6;border-left:6px solid var(--orange);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-weight:700}

/* mở đầu & kết thúc */
.final{text-align:center}
.final .big{font-size:4rem}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;text-align:left;margin:14px 0}
.recap div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1rem}
.recap b{color:var(--teal-d)}

/* bàn phím & bảng */
.kbrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.key{display:inline-flex;min-width:72px;height:64px;padding:0 14px;border:3px solid var(--ink);border-radius:12px;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;background:#fff;box-shadow:0 5px 0 rgba(39,50,58,.25)}
.kcap{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:0 10px;background:#fff;font-weight:800;box-shadow:0 2px 0 rgba(39,50,58,.25)}
.tbl{border-collapse:collapse;width:100%;background:#fff;border-radius:10px;overflow:hidden}
.tbl th{background:var(--teal);color:#fff;padding:10px 14px;text-align:left}
.tbl td{border:2px solid #cfd6da;padding:10px 14px;font-weight:700}
.tbl td.hc{background:#fff1dd;outline:3px solid var(--orange);outline-offset:-3px}
.tbl th.tapz,.tbl td.tapz{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>⌨️ Trợ thủ tiện ích – Bài 22</h1>

/* ---------- trạng thái ---------- */
const state = {cur:0, got:MISSIONS.map(()=>null), intro:true};
try{ const s=JSON.parse(localStorage.getItem('k5b22')||'null'); if(s&&s.got&&s.got.length===MISSIONS.length){ state.got=s.got; state.read=s.read||[]; const f=s.got.findIndex(x=>x===null); state.cur=f<0?MISSIONS.length:f; state.intro=state.cur===0; } }catch(e){}
function save(){ try{localStorage.setItem('k5b22',JSON.stringify({got:state.got,read:state.read||[]}))}catch(e){} }
function restart(force){
  if(!force && !confirm('Em muốn làm lại từ đầu? Tiến độ đã lưu sẽ bị xóa.')) return;
  state.got=MISSIONS.map(()=>null); state.read=[]; state.cur=0; state.intro=true; save(); render();
}
function renderMap(){
  const map=$('#map'); map.innerHTML='';
  MISSIONS.forEach((m,i)=>{
    const unlocked = i===0 || state.got[i-1]!==null;
    const b=el(`<button ${unlocked?'':'disabled'} class="${state.got[i]!==null?'done':''} ${i===state.cur&&!state.intro?'cur':''}"><span class="n">${state.got[i]!==null?'✅':m.icon}</span><span class="l">${m.label}</span></button>`);
    b.onclick=()=>{state.cur=i;state.intro=false;render()};
    map.appendChild(b);
  });
  $('#starCount').textContent = state.got.reduce((a,b)=>a+(b||0),0);
}
function render(){
  renderMap();
  const hw=$('#howto'), lay=$('#layout'), cm=MISSIONS[state.cur];
  if(state.intro||!cm){ hw.style.display='none'; lay.classList.add('solo'); }
  else { lay.classList.remove('solo'); hw.style.display='';
    hw.innerHTML='<h3>📝 Cách làm bài</h3><ol>'+cm.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="tip">💡 '+cm.tip+'</p>'; }
  const st=$('#stage'); st.innerHTML='';
  window.scrollTo({top:0,behavior:'smooth'});
  if(state.intro) return intro(st);
  if(state.cur>=MISSIONS.length) return finale(st);
  MISSIONS[state.cur].run(st);
}
function brief(icon,title,text){
  return `<div class="brief"><div class="bh"><span class="badge">${icon}</span><h2>${title}</h2></div><p>${text}</p></div>`;
}
function fb(node,kind,html){ node.className='fb show '+kind; node.innerHTML=html; }
function finish(st,stars_,box){
  state.got[state.cur] = Math.max(state.got[state.cur]||0, stars_);
  save(); renderMap();
  const last = state.cur===MISSIONS.length-1;
  box.insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:14px;justify-content:space-between"><b>Kết quả: ${stars(stars_)}</b><button class="btn orange" id="next">${last?'Xem hồ sơ thám tử 🏅':'Nhiệm vụ tiếp theo ▶'}</button></div>`);
  $('#next').onclick=()=>{state.cur++;render()};
}
const starsFor = w => w===0?3:w<=2?2:1;

/* ---------- câu hỏi dùng chung ---------- */
function askQ(Q, host, onWrong, onDone){
  host.innerHTML='<div class="qtext">'+Q.q+'</div><div class="ops"></div><div class="fb"></div>';
  const ops=host.querySelector('.ops'), f=host.querySelector('.fb'); let done=false;
  const win=()=>{ done=true; fb(f,'ok','✔ Đúng rồi! '+(Q.why||'')); onDone(f); };
  const lose=msg=>{ onWrong(); fb(f,'no',msg); };
  if(Q.html){
    ops.innerHTML=Q.html;
    ops.querySelectorAll('[data-k]').forEach(z=>z.onclick=e=>{ e.stopPropagation(); if(done||z.classList.contains('bad')) return;
      if(z.dataset.k===Q.key){ z.classList.add('good'); win(); } else { z.classList.add('bad'); lose('Chưa đúng, hãy chạm vào chỗ khác.'); } });
  } else if(Q.sort){
    sortGame(ops,Q.sort,()=>onWrong(),sf=>{ done=true; onDone(sf); });
  } else if(Q.tf){
    const sel=Q.tf.map(()=>null), rows=[]; const LB=Q.lab||['Đúng','Sai'];
    Q.tf.forEach((s,k)=>{
      const r=el('<div class="tfrow"><div class="s">'+s+'</div><button class="chip" data-v="1">'+LB[0]+'</button><button class="chip" data-v="0">'+LB[1]+'</button></div>');
      r.querySelectorAll('.chip').forEach(b=>b.onclick=e=>{ e.stopPropagation(); if(done) return; sel[k]=b.dataset.v==='1';
        r.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); r.classList.remove('bad'); });
      rows.push(r); ops.appendChild(r); });
    const chk=el('<button class="btn">Kiểm tra</button>'); ops.appendChild(chk);
    chk.onclick=e=>{ e.stopPropagation(); if(done) return;
      if(sel.some(v=>v===null)) return fb(f,'info','Hãy chọn đáp án cho tất cả các dòng.');
      let bad=0; rows.forEach((r,k)=>{ const ok=sel[k]===Q.a[k]; r.classList.toggle('good',ok); r.classList.toggle('bad',!ok); if(!ok) bad++; });
      if(bad) lose('Có '+bad+' dòng chưa đúng (viền đỏ). Hãy sửa lại.'); else { chk.disabled=true; win(); } };
  } else if(Array.isArray(Q.a)){
    const chosen=new Set();
    Q.o.forEach((t,k)=>{ const b=el('<button class="opt"><b>'+'ABCDEF'[k]+'.</b> '+t+'</button>');
      b.onclick=e=>{ e.stopPropagation(); if(done) return; chosen.has(k)?chosen.delete(k):chosen.add(k); b.classList.toggle('sel'); b.classList.remove('bad'); };
      ops.appendChild(b); });
    const chk=el('<button class="btn">Kiểm tra</button>'); ops.appendChild(chk);
    chk.onclick=e=>{ e.stopPropagation(); if(done) return;
      if(chosen.size!==Q.a.length) return fb(f,'info','Câu này cần chọn '+Q.a.length+' đáp án.');
      const ok=Q.a.every(k=>chosen.has(k));
      if(ok){ ops.querySelectorAll('.opt').forEach((b,k)=>{ if(chosen.has(k)){ b.classList.remove('sel'); b.classList.add('good'); } }); chk.disabled=true; win(); }
      else { ops.querySelectorAll('.opt').forEach((b,k)=>{ if(chosen.has(k)&&!Q.a.includes(k)) b.classList.add('bad'); }); lose('Chưa đúng. Hãy đọc lại và chọn lại.'); } };
  } else {
    Q.o.forEach((t,k)=>{ const b=el('<button class="opt"><b>'+'ABCD'[k]+'.</b> '+t+'</button>');
      b.onclick=e=>{ e.stopPropagation(); if(done||b.classList.contains('bad')) return;
        if(k===Q.a){ b.classList.add('good'); win(); } else { b.classList.add('bad'); lose('Chưa đúng, hãy chọn lại.'); } };
      ops.appendChild(b); });
  }
}
/* xáo trộn thứ tự đáp án (trừ câu Đúng/Sai 2 lựa chọn) */
function shuffleQ(Q){
  if(!Q.o || Q.o.length<3) return Q;
  const idx=shuffle(Q.o.map((_,i)=>i)), a=Array.isArray(Q.a)?Q.a.map(x=>idx.indexOf(x)):idx.indexOf(Q.a);
  return Object.assign({},Q,{o:idx.map(i=>Q.o[i]),a});
}

/* ---------- Học bài (flashcard mở khóa dần) ---------- */
function theory(st){
  const n=THEORY.length; const read=(state.read&&state.read.length===n)?state.read:new Array(n).fill(false); state.read=read;
  st.innerHTML = brief('📖','Học bài: '+LESSON_NAME,'Lật từng thẻ để đọc. Đọc xong bấm “Em đã hiểu”, một cửa sổ bài tập nhỏ sẽ hiện ra. Làm đúng để mở thẻ tiếp theo.')+
    '<div class="prog"><i id="pg" style="width:0"></i></div><div class="cards" id="cards"></div><div class="fb" id="fb"></div>';
  const box=$('#cards'), f=$('#fb');
  const unlockedUpTo=()=>{ const i=read.indexOf(false); return i<0?n:i; };
  function draw(){
    box.innerHTML='';
    const u=unlockedUpTo();
    THEORY.forEach((c,i)=>{
      const locked=i>u, flipped=box._open===i;
      let d;
      if(locked) d=el('<div class="fc locked"><div class="em">🔒</div><h3>Thẻ '+(i+1)+'</h3><small>Đọc thẻ trước để mở khóa</small></div>');
      else if(flipped){
        d=el('<div class="fc back"><p>'+c.t+'</p>'+(VIS[i]?'<div class="vwrap">'+VIS[i]+'</div>':'')+''+(c.e?'<div class="eg">💡 '+c.e+'</div>':'')+'<button class="btn">'+(read[i]?'Đóng thẻ':'Em đã hiểu ✓')+'</button></div>');
        d.querySelector('button').onclick=ev=>{
          ev.stopPropagation();
          if(read[i]){ box._open=-1; draw(); return; }
          const list=PRACT[i]; let qn=0;
          const mq=el('<div class="modal-back"><div class="modal"><div class="mh"><span>✏️ Bài tập nhỏ <span class="cnt"></span></span><button class="mx">✕ Quay lại thẻ</button></div><div class="mb"><p class="mi">Em đã đọc xong thẻ “'+c.h+'”. Hãy trả lời để mở thẻ tiếp theo nhé!</p><div class="qhost"></div></div></div></div>');
          const closeM=()=>{ mq.remove(); document.body.style.overflow=''; };
          mq.querySelector('.mx').onclick=closeM;
          const host=mq.querySelector('.qhost');
          const next=()=>{
            mq.querySelector('.cnt').textContent=list.length>1?'(Câu '+(qn+1)+'/'+list.length+')':'';
            askQ(list[qn],host,()=>{},fx=>{
              const last=qn===list.length-1;
              fx.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="btn orange" id="cont">'+(last?'Tiếp tục ▶':'Câu tiếp ▶')+'</button></div>');
              fx.querySelector('#cont').onclick=e3=>{ e3.stopPropagation();
                if(!last){ qn++; next(); } else { closeM(); read[i]=true; save(); box._open=-1; draw(); update(i); } };
            });
          };
          document.body.appendChild(mq); document.body.style.overflow='hidden'; next();
        };
      } else {
        d=el('<div class="fc'+(read[i]?' read':'')+'"><div class="em">'+c.i+'</div><h3>'+c.h+'</h3><small>'+(read[i]?'✔ Đã đọc – chạm để đọc lại':'Chạm để lật thẻ')+'</small></div>');
        d.onclick=()=>{ box._open=i; draw(); };
      }
      box.appendChild(d);
    });
  }
  function update(i){
    const cnt=read.filter(Boolean).length;
    $('#pg').style.width=(cnt/n*100)+'%';
    if(cnt===n){
      fb(f,'ok','🎉 Em đã đọc hết '+n+' thẻ! Sang phần luyện tập nhé.');
      if(state.got[state.cur]===null){ state.got[state.cur]=0; save(); renderMap(); }
      if(!$('#next')) f.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="btn orange" id="next">Sang phần luyện tập ▶</button></div>');
      $('#next').onclick=()=>{state.cur++;render()};
    } else if(i<n-1){
      const t=box.children[i+1]; if(t) t.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  }
  box._open=-1; draw(); $('#pg').style.width=(read.filter(Boolean).length/n*100)+'%';
}

/* ---------- trò chơi phân loại: chạm thẻ rồi chạm ô, hoặc kéo thả ---------- */
function sortGame(host, cfg, onWrong, onDone){
  const items=shuffle(cfg.items.map(([t,b],id)=>({id,t,b,loc:'pool',locked:false})));
  let picked=null;
  host.innerHTML=`<div class="pool" id="pool"></div><div class="bins ${cfg.bins.length===2||cfg.bins.length===4?'c2':'c3'}" id="bins">${cfg.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b[0]}</h3><small>${b[1]||''}</small><div class="in"></div></div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="chk" disabled>Kiểm tra</button></div><div class="fb" id="sfb"></div>`;
  const pool=host.querySelector('#pool'), bins=[...host.querySelectorAll('.bin')], chk=host.querySelector('#chk'), f=host.querySelector('#sfb');
  function chipEl(it){
    const c=el('<button class="chip'+(picked===it.id?' sel':'')+(it.locked?' good':'')+'">'+it.t+'</button>');
    if(!it.locked){
      c.draggable=true;
      c.ondragstart=e=>{ e.dataTransfer.setData('text/plain',it.id); picked=it.id; };
      c.onclick=e=>{ e.stopPropagation(); if(it.loc==='pool'){ picked=picked===it.id?null:it.id; } else { it.loc='pool'; picked=null; } draw(); };
    }
    return c;
  }
  function draw(){
    pool.innerHTML=''; items.filter(i=>i.loc==='pool').forEach(i=>pool.appendChild(chipEl(i)));
    pool.classList.toggle('empty',!items.some(i=>i.loc==='pool'));
    bins.forEach(b=>{ const inn=b.querySelector('.in'); inn.innerHTML=''; items.filter(i=>i.loc===+b.dataset.b).forEach(i=>inn.appendChild(chipEl(i))); b.classList.toggle('hot',picked!==null); });
    chk.disabled = items.some(i=>i.loc==='pool');
  }
  function place(id,to){ const it=items.find(x=>x.id==id); if(!it||it.locked) return; it.loc=to; picked=null; draw(); }
  bins.forEach(b=>{
    b.onclick=()=>{ if(picked!==null) place(picked,+b.dataset.b); };
    b.ondragover=e=>{ e.preventDefault(); b.classList.add('over'); };
    b.ondragleave=()=>b.classList.remove('over');
    b.ondrop=e=>{ e.preventDefault(); b.classList.remove('over'); place(e.dataTransfer.getData('text/plain'),+b.dataset.b); };
  });
  pool.ondragover=e=>e.preventDefault();
  pool.ondrop=e=>{ e.preventDefault(); place(e.dataTransfer.getData('text/plain'),'pool'); };
  chk.onclick=()=>{
    let bad=0; items.forEach(it=>{ if(it.loc===it.b) it.locked=true; else bad++; });
    if(!bad){ draw(); chk.disabled=true; fb(f,'ok','✔ Đúng hết rồi! '+(cfg.why||'')); onDone(f); }
    else { onWrong(); fb(f,'no','Có '+bad+' thẻ chưa đúng. Thẻ đúng đã được khóa màu xanh, các thẻ còn lại quay về khay để em xếp lại.');
      chk.disabled=true; bins.forEach(b=>b.querySelectorAll('.chip:not(.good)').forEach(c=>c.classList.add('bad')));
      setTimeout(()=>{ items.forEach(it=>{ if(!it.locked) it.loc='pool'; }); draw(); },900); }
  };
  draw();
}

/* ---------- chạm vào trang: lần lượt từng manh mối ---------- */
function clueGame(host, cfg, onWrong, onDone){
  host.innerHTML=(cfg.pre||'')+'<div class="clue-q" id="cq"></div><div id="pg2">'+cfg.page+'</div><div class="fb" id="cfb"></div>';
  const cq=host.querySelector('#cq'), f=host.querySelector('#cfb'); let k=0;
  const show=()=>{ cq.innerHTML='🔎 Manh mối '+(k+1)+'/'+cfg.clues.length+': '+cfg.clues[k].q; cq.classList.remove('pop'); void cq.offsetWidth; cq.classList.add('pop'); };
  show();
  host.querySelectorAll('[data-k]').forEach(z=>z.onclick=e=>{
    e.stopPropagation(); if(k>=cfg.clues.length||z.classList.contains('good')||z.classList.contains('bad')) return;
    const c=cfg.clues[k];
    if(z.dataset.k===c.key){ z.classList.add('good'); fb(f,'ok','✔ '+c.why); if(cfg.onHit) cfg.onHit(c,host); k++;
      if(k<cfg.clues.length) show(); else { cq.innerHTML='🏅 Tìm đủ manh mối!'; onDone(f); } }
    else { z.classList.add('bad'); onWrong(); fb(f,'no',c.miss||'Chưa đúng, hãy nhìn kỹ lại rồi chạm chỗ khác.'); setTimeout(()=>z.classList.remove('bad'),700); }
  });
}

/* ---------- chọn nút cho từng tình huống ---------- */
function judge(host, intro, labels, list, onWrong, onDone){
  host.innerHTML='<p class="tip">'+intro+'</p><div class="jl"></div><div class="fb"></div>';
  const box=host.querySelector('.jl'), f=host.querySelector('.fb'); let done=0;
  list.forEach(s=>{
    const d=el('<div class="scn">'+s.t+'<div class="row"><button class="chip" data-a="1">'+labels[0]+'</button><button class="chip" data-a="0">'+labels[1]+'</button></div></div>');
    d.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      if(d.dataset.fin) return;
      if((b.dataset.a==='1')===s.ok){ d.dataset.fin=1; d.classList.add('right'); b.classList.add('good'); d.insertAdjacentHTML('beforeend','<div style="margin-top:6px;font-size:1rem">✔ '+s.why+'</div>');
        if(++done===list.length) onDone(f);
      } else { onWrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),600); fb(f,'no','Chưa đúng, hãy đọc lại tình huống và nghĩ xem em đã kiểm tra, hiểu và đúng ý mình chưa.'); }
    });
    box.appendChild(d);
  });
}

        <div class="tapbox"><div class="tapz" data-k="book">📕 Sách giáo khoa</div><div class="tapz" data-k="note">📓 Vở ghi chép</div><div class="tapz" data-k="word">📝 Phần mềm soạn thảo văn bản (Word, Google Docs)</div><div class="tapz" data-k="vid">🎬 Video trên mạng</div></div></div></div>`,
      clues:[
        {q:'Chạm vào <b>từ gõ sai</b> mà Autocorrect sẽ sửa thành “và”.',key:'av',why:'“àv” là lỗi gõ sai của “và”, Autocorrect tự sửa lại.',miss:'Từ nào nhìn không giống tiếng Việt?'},
        {q:'Chạm vào <b>khung gợi ý</b> do Autocomplete đưa ra khi em gõ “Tự động”.',key:'sug',why:'Khung gợi ý hiện bên dưới ô gõ khi em mới gõ dở.',miss:'Gợi ý hiện ra bên dưới chữ em đang gõ.'},
        {q:'Tính năng tự động sửa lỗi <b>thường xuất hiện ở đâu</b>? Chạm vào đáp án đúng.',key:'word',why:'Autocorrect có trong phần mềm soạn thảo văn bản như Word, Google Docs.',miss:'Cần nơi có bàn phím để gõ chữ. Thử chỗ khác nhé.'}
      ]
    },()=>wrong++,f=>{ fb(f,'ok','🏅 Hoàn thành! Em đã phân biệt được Autocorrect và Autocomplete.'); finish(st,starsFor(wrong),g2); });
  });
}

/* ---------- Nhiệm vụ 2: phím tắt ---------- */
function m2(st){
  let wrong=0;
  st.innerHTML=brief('⌨️','Nhiệm vụ 2: Phím tắt','Ghép phím tắt với việc cần làm, rồi tìm phím trên bàn phím.')+'<h3>Bước 1 · Ghép phím tắt với trường hợp sử dụng</h3><p class="hint">Chạm vào thẻ, rồi chạm vào ô. Hoặc kéo thả.</p><div id="g1"></div><div id="g2"></div>';
  sortGame($('#g1'),{
    bins:[['🔁 Chuyển ứng dụng','Chuyển lần lượt sang các ứng dụng đang mở'],['📋 Sao chép','Sao chép văn bản hoặc tập tin'],['📥 Dán','Dán văn bản hoặc tập tin']],
    items:[['Alt + Tab hoặc CMD + Tab',0],['Ctrl + C hoặc CMD + C',1],['Ctrl + V hoặc CMD + V',2]],
    why:'Alt + Tab chuyển ứng dụng. Ctrl + C sao chép. Ctrl + V dán. Trên Mac dùng CMD thay Ctrl.'
  },()=>wrong++,()=>{
    const g2=$('#g2');
    g2.innerHTML='<h3 style="margin-top:20px">Bước 2 · Tìm phím trên bàn phím</h3><div id="cg"></div>';
    clueGame($('#cg'),{
      page:`<div class="tapbox" style="text-align:center"><div class="kbrow"><span class="key tapz" data-k="ctrl">Ctrl</span><span class="key tapz" data-k="alt">Alt</span><span class="key tapz" data-k="tab">Tab</span><span class="key tapz" data-k="cmd">CMD</span></div>
        <div class="kbrow"><span class="key tapz" data-k="x">X</span><span class="key tapz" data-k="c">C</span><span class="key tapz" data-k="v">V</span><span class="key tapz" data-k="z">Z</span><span class="key tapz" data-k="s">S</span></div></div>`,
      clues:[
        {q:'Em đã sao chép một đoạn văn. Để <b>dán</b>, nhấn Ctrl cùng với phím nào?',key:'v',why:'Ctrl + V là phím tắt để dán.',miss:'Chưa đúng. V giống mũi tên chỉ xuống để “đặt” vào.'},
        {q:'Để <b>hoàn tác</b> (Undo), nhấn Ctrl cùng với phím nào?',key:'z',why:'Ctrl + Z là phím tắt để hoàn tác.',miss:'Undo = quay lại một bước. Thử phím khác nhé.'},
        {q:'Để <b>cắt</b> (Cut), nhấn Ctrl cùng với phím nào?',key:'x',why:'Ctrl + X là phím tắt để cắt.',miss:'Cut giống cây kéo, hình chữ X.'},
        {q:'Để <b>lưu</b> (Save), nhấn Ctrl cùng với phím nào?',key:'s',why:'Ctrl + S là phím tắt để lưu.',miss:'Save bắt đầu bằng chữ S.'},
        {q:'Trên máy <b>Mac</b>, phím nào dùng <b>thay cho Ctrl</b>?',key:'cmd',why:'Trên macOS dùng CMD thay cho Ctrl.',miss:'Phím này cũng có tên trong ví dụ CMD + C.'}
      ]
    },()=>wrong++,f=>{ fb(f,'ok','🏅 Hoàn thành! Em đã biết các phím tắt phổ biến trên Windows và macOS.'); finish(st,starsFor(wrong),g2); });
  });
}

/* ---------- Nhiệm vụ 3: AI rà soát lỗi ---------- */
function m3(st){
  let wrong=0;
  st.innerHTML=brief('🤖','Nhiệm vụ 3: AI rà soát lỗi','Em nhờ AI rà soát câu: “Hôm nay em đi hoc ở trường.”')+'<h3>Bước 1 · Có nên chấp nhận gợi ý của AI?</h3><div id="g1"></div><div id="g2"></div>';
  judge($('#g1'),'Với mỗi gợi ý của AI, chọn: <b>Chấp nhận</b> hay <b>Chưa nên chấp nhận</b>.',['✅ Chấp nhận','🚫 Chưa nên'],[
    {t:'AI gợi ý sửa “hoc” thành “học”. Em đọc lại thấy đúng ý mình.',ok:true,why:'Đã kiểm tra và đúng ý mình thì có thể chấp nhận.'},
    {t:'AI gợi ý đổi cả câu thành “Hôm nay tôi đến lớp.” Câu này đổi ý của em.',ok:false,why:'Gợi ý làm đổi ý của em thì không nên nhận.'},
    {t:'AI gợi ý một cách sửa mà em chưa hiểu.',ok:false,why:'Không chấp nhận gợi ý nếu chưa hiểu. Hãy tìm hiểu hoặc hỏi giáo viên.'}
  ],()=>wrong++,()=>{
    const g2=$('#g2');
    g2.innerHTML='<h3 style="margin-top:20px">Bước 2 · Cách dùng AI rà soát lỗi</h3><div id="j2"></div>';
    judge($('#j2'),'Với mỗi việc làm, chọn: <b>Đúng cách</b> hay <b>Chưa đúng</b>.',['👍 Đúng cách','👎 Chưa đúng'],[
      {t:'Đọc lại từng gợi ý của AI trước khi nhận.',ok:true,why:'AI cần được kiểm tra.'},
      {t:'Bấm chấp nhận mọi gợi ý mà không đọc.',ok:false,why:'Không chấp nhận mọi gợi ý nếu chưa hiểu.'},
      {t:'Tự chịu trách nhiệm với văn bản cuối cùng.',ok:true,why:'Người viết chịu trách nhiệm với văn bản cuối cùng.'},
      {t:'Nghĩ rằng AI luôn đúng nên không cần xem lại.',ok:false,why:'AI giúp tiết kiệm thời gian nhưng cần kiểm tra.'}
    ],()=>wrong++,f=>{ fb(f,'ok','🏅 Hoàn thành! AI gợi ý – em kiểm tra – người viết chịu trách nhiệm.'); finish(st,starsFor(wrong),$('#j2')); });
  });
}

/* ---------- Trắc nghiệm ---------- */
function quiz(st){
  const qs=shuffle(QUIZ).map(shuffleQ); let qi=0, wrong=0;
  function draw(){
    st.innerHTML = brief('✅','Trắc nghiệm: Câu '+(qi+1)+'/'+qs.length,'Đọc kỹ rồi chọn đáp án đúng.')+
      '<div class="prog"><i style="width:'+(qi/qs.length*100)+'%"></i></div><div id="qh"></div>';
    askQ(qs[qi],$('#qh'),()=>{wrong++},f=>{
      if(qi<qs.length-1){ f.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="btn orange" id="nq">Câu tiếp ▶</button></div>'); $('#nq').onclick=()=>{qi++;draw()}; }
      else { st.insertAdjacentHTML('beforeend','<p style="margin-top:12px"><b>Em đã trả lời xong!</b> Số lần chọn sai: '+wrong+'.</p>'); finish(st,wrong<=2?3:wrong<=6?2:1,st); }
    });
  }
  draw();
}

/* ---------- mở đầu & kết thúc ---------- */
function intro(st){
  st.innerHTML = `
  <div class="final">
    <div class="big">⌨️</div>
    <h2 style="font-size:2rem;color:var(--teal-d)">Bài 22: Các tính năng tiện ích</h2>
    <p>Máy tính có nhiều tính năng tiện ích giúp em gõ nhanh và đúng hơn.</p>
    <div class="recap"><div><b>Em sẽ học</b><br>Autocorrect · Autocomplete · phím tắt Windows và macOS · AI rà soát lỗi</div><div><b>Em sẽ luyện</b><br>Phân biệt tính năng · tìm phím tắt · kiểm tra gợi ý của AI</div><div><b>Cách chơi</b><br>Học bài → 3 nhiệm vụ → Trắc nghiệm.</div></div>
    <p class="tip" style="text-align:left">Em sẽ học qua <b>thẻ flashcard</b>, làm <b>3 nhiệm vụ</b>, rồi làm <b>trắc nghiệm</b>. Mỗi nhiệm vụ cho tối đa 3 ⭐. Em trả lời càng ít lần sai thì càng được nhiều sao. Bên trái màn hình luôn có khung <b>“Cách làm bài”</b>. Tiến độ được lưu lại trên máy của em.</p>
    <button class="btn" id="go">Bắt đầu ▶</button>
  </div>`;
  $('#go').onclick=()=>{state.intro=false;render()};
}
function finale(st){
  const total=state.got.reduce((a,b)=>a+(b||0),0);
  const rank = total>=10?'Trợ thủ xuất sắc':total>=7?'Trợ thủ giỏi':'Trợ thủ tập sự';
  st.innerHTML=`<div class="final"><div class="big">🏅</div><h2 style="font-size:2rem;color:var(--teal-d)">${rank}</h2>
  <p>Em đạt <b>${total} / 12 ⭐</b></p>
  <div class="recap"><div><b>Tự động sửa lỗi</b><br>Autocorrect sửa lỗi chính tả hoặc gõ sai, ví dụ “tshi” → “this”.</div><div><b>Tự động hoàn thành</b><br>Autocomplete dự đoán và gợi ý từ khi em gõ vài kí tự đầu.</div><div><b>Phím tắt</b><br>Ctrl + C sao chép · Ctrl + X cắt · Ctrl + V dán · Ctrl + Z hoàn tác · Ctrl + S lưu · Alt + Tab chuyển ứng dụng. Mac: CMD thay Ctrl.</div><div><b>AI rà soát lỗi</b><br>Tiết kiệm thời gian nhưng cần kiểm tra. Không nhận gợi ý nếu chưa hiểu. Người viết chịu trách nhiệm.</div></div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Chơi lại từ đầu</button></div></div>`;
  $('#again').onclick=()=>restart(true);
}


let fsz=18; try{ fsz=+localStorage.getItem('k5fontsize')||18 }catch(e){}
const setSize=px=>{ fsz=Math.max(16,Math.min(28,px)); document.documentElement.style.fontSize=fsz+'px'; try{localStorage.setItem('k5fontsize',fsz)}catch(e){} };
setSize(fsz);
$('#fsm').onclick=()=>setSize(fsz-2); $('#fbg').onclick=()=>setSize(fsz+2);
$('#restart').onclick=()=>restart();
render();
</script>
