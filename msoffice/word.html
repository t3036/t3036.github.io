<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
:root{--w:#2B6FD6;--w-sang:#5B9BF2;--w-dam:#143A8C;--w-nhat:#E6F0FD}
body{background:linear-gradient(#CFE3FB,#E6F0FD 35%,#F4F8FE);min-height:100vh}
.sel{max-width:960px;margin:0 auto;padding:2rem 1.25rem 4rem}
.ve{display:inline-block;margin-bottom:1rem;color:var(--w);font-weight:600;text-decoration:none}
.ve:hover{text-decoration:underline}
.dau{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-bottom:.4rem}
.dau img{width:52px;height:52px}
.sel h1{font-family:"Baloo 2",Bitter,serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);color:var(--w-dam);margin:0}
.sub{text-align:center;color:var(--w);margin:0 0 2rem}
.luoi{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4rem 1.1rem}
.o{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.bai{text-decoration:none;width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  background:linear-gradient(160deg,var(--w-sang),var(--w));border:0;border-radius:22px;cursor:pointer;color:#fff;
  font-family:"Baloo 2",Bitter,serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1;
  box-shadow:0 8px 0 var(--w-dam),0 14px 20px rgba(20,58,140,.25);transition:transform .15s,box-shadow .15s,filter .15s}
.bai:hover{transform:translateY(-4px);filter:brightness(1.07)}
.bai:active{transform:translateY(4px);box-shadow:0 4px 0 var(--w-dam)}
.ten{font-size:.88rem;font-weight:600;color:var(--w-dam);text-align:center;line-height:1.3}

[hidden]{display:none!important}
@media(max-width:700px){.luoi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="thanh-menu">
  <div class="menu-trong">
    <a class="logo" href="../index.html"><span class="logo-icon" aria-hidden="true">🚀</span><span class="logo-chu">Trang chủ</span></a>
  </div>
</header>

<main class="sel">
  <a class="ve" href="index.html">← Microsoft Office</a>

  <section id="chon">
    <div class="dau"><img src="img/word.svg" alt=""><h1>Học Word</h1></div>
    <p class="sub">Danh sách 10 bài học Word</p>
    <div class="luoi" id="luoi"></div>
  </section>

</main>

<script>
const BAI = ["Nhập văn bản","Chọn văn bản","In đậm (Bold)","In nghiêng (Italic)","Gạch chân (Underline)","Đổi cỡ chữ","Đổi màu chữ","Căn lề văn bản","Sao chép và dán","Lưu tài liệu"];
document.getElementById('luoi').innerHTML = BAI.map((t,i)=>`
  <div class="o">
    ${i<10?`<a class="bai" href="word-simulator.html?bai=${i+1}" aria-label="Bài ${i+1}: ${t}">${i+1}</a>`:`<button class="bai" aria-label="Bài ${i+1}: ${t}">${i+1}</button>`}
    <span class="ten">${t}</span>
  </div>`).join('');
</script>
</body>
</html>
