<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft Office &mdash; Vui học Tin học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.word{background:linear-gradient(160deg,#4F8EF0,#1B4FB5)}
.excel{background:linear-gradient(160deg,#3DBE7A,#13763F)}
.powerpoint{background:linear-gradient(160deg,#FF8A5B,#C8401A)}
.logo-app{background:#fff;border-radius:18px;padding:10px;width:84px;height:84px;margin-bottom:.5rem;box-shadow:0 4px 10px rgba(0,0,0,.15)}
</style>
</head>
<body id="trang-chu">

<header class="thanh-menu">
  <div class="menu-trong">
    <a class="logo" href="../index.html">
      <span class="logo-icon" aria-hidden="true">🚀</span>
      <span class="logo-chu">Trang chủ</span>
    </a>
  </div>
</header>

<main>
  <section class="cap-do">
    <h2 class="tieu-de-khu">Học Microsoft Office 💼</h2>
    <p class="mo-ta-khu">Chọn phần mềm bạn muốn học để bắt đầu nhé!</p>

    <div class="luoi-cap-do">
      <a class="the-cap-do word" href="word.html">
        <img class="logo-app" src="img/word.svg" alt="" width="72" height="72">
        <span class="the-ten">Word</span>
        <span class="the-mo-ta">Soạn thảo văn bản</span>
        <span class="the-nut">Bắt đầu học</span>
      </a>
      <a class="the-cap-do excel" href="excel.html">
        <img class="logo-app" src="img/excel.svg" alt="" width="72" height="72">
        <span class="the-ten">Excel</span>
        <span class="the-mo-ta">Bảng tính &amp; hàm tính toán</span>
        <span class="the-nut">Bắt đầu học</span>
      </a>
      <a class="the-cap-do powerpoint" href="powerpoint.html">
        <img class="logo-app" src="img/powerpoint.svg" alt="" width="72" height="72">
        <span class="the-ten">PowerPoint</span>
        <span class="the-mo-ta">Thiết kế bài thuyết trình</span>
        <span class="the-nut">Bắt đầu học</span>
      </a>
    </div>
  </section>
</main>

</body>
</html>
